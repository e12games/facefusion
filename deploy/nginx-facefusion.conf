# 脸幻 · facefusion.iqiyia.cyou
# 程序监听 127.0.0.1:8092（见 /etc/lianhuan.env LIANHUAN_PORT）
# 宝塔：网站 → 添加站点 → 设置 → 反向代理 → http://127.0.0.1:8092
# 或把本文件 include 到站点配置（路径因宝塔版本而异）

server {
	listen 80;
	server_name facefusion.iqiyia.cyou;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	server_name facefusion.iqiyia.cyou;

	# 宝塔申请 SSL 后，证书路径以面板显示为准，例如：
	# ssl_certificate    /www/server/panel/vhost/cert/facefusion.iqiyia.cyou/fullchain.pem;
	# ssl_certificate_key /www/server/panel/vhost/cert/facefusion.iqiyia.cyou/privkey.pem;

	client_max_body_size 32m;

	location / {
		proxy_pass http://127.0.0.1:8092;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

{% extends "base.html" %}
{% block title %}修改管理员密码 · 脸幻{% endblock %}
{% block content %}
<section class="form-card">
	<h1>修改管理员密码</h1>
	<p class="hint">安装默认密码仅方便首次进后台。改完后提示会消失，不影响其它功能。</p>
	{% if error %}<p class="error">{{ error }}</p>{% endif %}
	{% if message %}<p class="ok">{{ message }}</p>{% endif %}
	<form method="post">
		<label>当前密码<input type="password" name="old_password" required autocomplete="current-password"></label>
		<label>新密码（至少 8 位）<input type="password" name="new_password" required minlength="8" autocomplete="new-password"></label>
		<label>再输一次新密码<input type="password" name="new_password2" required minlength="8" autocomplete="new-password"></label>
		<button class="btn" type="submit">保存新密码</button>
	</form>
	<p class="hint"><a href="/admin">返回后台</a></p>
</section>
{% endblock %}

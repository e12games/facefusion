{% extends "base.html" %}
{% block title %}登录 · 脸幻{% endblock %}
{% block content %}
<section class="form-card">
	<h1>登录</h1>
	<p>网站登录可进后台（管理员）或查看账号。绿色包请使用同一邮箱密码，且必须联网。</p>
	{% if error %}<p class="error">{{ error }}</p>{% endif %}
	<form method="post">
		<label>邮箱<input type="email" name="email" value="{{ email|default('') }}" required></label>
		<label>密码<input type="password" name="password" required></label>
		<button class="btn" type="submit">登录</button>
	</form>
	<p class="hint">没有账号？<a href="/register">去注册</a></p>
</section>
{% endblock %}

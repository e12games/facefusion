{% extends "base.html" %}
{% block title %}注册 · 脸幻{% endblock %}
{% block content %}
<section class="form-card">
	<h1>邮箱注册</h1>
	<p>注册后用于付费登录绿色包。试用不必先注册。</p>
	{% if error %}<p class="error">{{ error }}</p>{% endif %}
	<form method="post">
		<label>邮箱<input type="email" name="email" value="{{ email|default('') }}" required></label>
		<label>密码<input type="password" name="password" minlength="6" required></label>
		<label>再输一次密码<input type="password" name="password2" minlength="6" required></label>
		<button class="btn" type="submit">注册</button>
	</form>
	<p class="hint">已有账号？<a href="/login">去登录</a></p>
</section>
{% endblock %}

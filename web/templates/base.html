<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="dark">
	<meta name="theme-color" content="#12141a">
	<title>{% block title %}脸幻{% endblock %}</title>
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>
	<header class="top">
		<a class="logo" href="/">脸幻</a>
		<nav>
			<a href="/#use">怎么用</a>
			<a href="/#price">价格</a>
			{% if user %}
				<span class="who">{{ user.email }}</span>
				{% if not user.is_admin and not user.is_paid %}<a href="/buy">购买会员</a>{% endif %}
				{% if user.is_admin %}<a href="/admin">后台</a>{% endif %}
				{% if user.is_admin and need_password_hint %}<a href="/admin/password" class="hint">请改密</a>{% endif %}
				<a href="/logout">退出</a>
			{% else %}
				<a href="/login">登录</a>
				<a class="btn" href="/register">注册</a>
			{% endif %}
		</nav>
	</header>
	<main>
		{% block content %}{% endblock %}
	</main>
	<footer>请只处理你有权使用的照片和视频。</footer>
</body>
</html>
